<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form Filler</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:wght@300;400;500;600&display=swap');

    :root {
      --bg: #0f0f0f;
      --surface: #191919;
      --surface2: #242424;
      --border: #2e2e2e;
      --accent: #c8f060;
      --accent-dim: rgba(200, 240, 96, 0.12);
      --accent-glow: rgba(200, 240, 96, 0.25);
      --text: #f0f0f0;
      --text-muted: #808080;
      --text-dim: #4a4a4a;
      --success: #60f0a8;
      --error: #f06060;
      --warning: #f0c060;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      width: 340px;
      min-height: 200px;
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 18px 14px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .logo {
      width: 28px;
      height: 28px;
      background: var(--accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo svg {
      width: 16px;
      height: 16px;
    }

    .header-text h1 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .header-text p {
      font-size: 10px;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.04em;
      margin-top: 1px;
    }

    /* Folder section */
    .section {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }

    .section-label {
      font-size: 9px;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .folder-display {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      min-height: 36px;
    }

    .folder-display:hover {
      border-color: var(--accent);
      background: var(--surface2);
    }

    .folder-display.has-folder {
      border-color: rgba(200, 240, 96, 0.3);
    }

    .folder-icon {
      color: var(--accent);
      flex-shrink: 0;
      opacity: 0.8;
    }

    .folder-path {
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .folder-path.set {
      color: var(--text);
    }

    .folder-change {
      font-size: 9px;
      font-family: 'DM Mono', monospace;
      color: var(--text-dim);
      flex-shrink: 0;
      text-decoration: underline;
    }

    /* File list */
    .files-section {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      display: none;
    }

    .files-section.visible {
      display: block;
    }

    .files-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-height: 120px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 6px;
      border-radius: 5px;
      transition: background 0.1s;
    }

    .file-item:hover {
      background: var(--surface);
    }

    .file-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
    }

    .file-dot.matched {
      background: var(--success);
    }

    .file-dot.unmatched {
      background: var(--warning);
    }

    .file-dot.error {
      background: var(--error);
    }

    .file-name {
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      color: var(--text-muted);
      flex: 1;
    }

    .file-status {
      font-size: 9px;
      font-family: 'DM Mono', monospace;
      color: var(--text-dim);
    }

    .file-status.matched { color: var(--success); }
    .file-status.unmatched { color: var(--warning); }
    .file-status.error { color: var(--error); }

    /* Action area */
    .action-section {
      padding: 14px 18px;
    }

    .fill-btn {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: #0f0f0f;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .fill-btn:hover:not(:disabled) {
      opacity: 0.92;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .fill-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .fill-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .fill-btn svg {
      width: 14px;
      height: 14px;
    }

    /* Status bar */
    .status {
      padding: 10px 18px 14px;
      display: none;
    }

    .status.visible {
      display: block;
    }

    .status-inner {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      line-height: 1.5;
    }

    .status-inner.success {
      border-color: rgba(96, 240, 168, 0.3);
      background: rgba(96, 240, 168, 0.05);
      color: var(--success);
    }

    .status-inner.error {
      border-color: rgba(240, 96, 96, 0.3);
      background: rgba(240, 96, 96, 0.05);
      color: var(--error);
    }

    .status-inner.info {
      border-color: rgba(200, 240, 96, 0.3);
      background: var(--accent-dim);
      color: var(--accent);
    }

    .status-icon {
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* Scan button */
    .scan-btn {
      width: 100%;
      padding: 7px;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 7px;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .scan-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .scan-btn svg {
      width: 12px;
      height: 12px;
    }

    /* Empty state */
    .empty-state {
      padding: 20px 18px;
      text-align: center;
    }

    .empty-state p {
      font-size: 11px;
      color: var(--text-dim);
      font-family: 'DM Mono', monospace;
      line-height: 1.6;
    }

    /* Spinner */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(15, 15, 15, 0.3);
      border-top-color: #0f0f0f;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="3" width="12" height="2" rx="1" fill="#0f0f0f"/>
        <rect x="2" y="7" width="8" height="2" rx="1" fill="#0f0f0f"/>
        <rect x="2" y="11" width="10" height="2" rx="1" fill="#0f0f0f"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>Form Filler</h1>
      <p>markdown → form fields</p>
    </div>
  </div>

  <!-- Folder picker -->
  <div class="section">
    <div class="section-label">Source Folder</div>
    <div class="folder-display" id="folderDisplay">
      <span class="folder-icon">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
          <path d="M1 3.5A1.5 1.5 0 012.5 2h3.379a1.5 1.5 0 011.06.44L8.061 3.5H12.5A1.5 1.5 0 0114 5v6.5A1.5 1.5 0 0112.5 13h-10A1.5 1.5 0 011 11.5v-8z" fill="currentColor" opacity="0.9"/>
        </svg>
      </span>
      <span class="folder-path" id="folderPath">Click to choose folder…</span>
    </div>
  </div>

  <!-- File list -->
  <div class="files-section" id="filesSection">
    <div class="section-label">Markdown Files</div>
    <div class="files-list" id="filesList"></div>
  </div>

  <!-- Empty state when folder chosen but no .md files -->
  <div class="empty-state" id="emptyState" style="display:none">
    <p>No .md files found<br>in this folder.</p>
  </div>

  <!-- Actions -->
  <div class="action-section">
    <button class="scan-btn" id="scanBtn" style="display:none">
      <svg viewBox="0 0 12 12" fill="none">
        <path d="M10 6A4 4 0 112 6a4 4 0 018 0z" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10.5 10.5L9 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      SCAN PAGE
    </button>
    <button class="fill-btn" id="fillBtn" disabled>
      <svg viewBox="0 0 14 14" fill="none">
        <path d="M2 7h10M7 2l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Fill Form
    </button>
  </div>

  <!-- Status -->
  <div class="status" id="statusArea">
    <div class="status-inner" id="statusInner">
      <span class="status-icon" id="statusIcon"></span>
      <span id="statusText"></span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
